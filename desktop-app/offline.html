<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8" />
  <title>Gitego Kids World — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e1b4b, #06070b 70%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 36px 28px;
    }
    button {
      margin-top: 18px;
      padding: 12px 26px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      color: #fff;
      font-weight: 800;
      font-size: 0.96rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin:0 0 10px">🌐 Gitego Kids World</h1>
    <p style="margin:0;color:#94a3b8;line-height:1.6">
      Mudasobwa yawe nta internet ifite ubu cyangwa server irimo gukanguka (~30s). Kanda hano munsi wongere ugerageze.
    </p>
    <button onclick="window.location.href='https://gitego-kids-world.onrender.com'">🔄 Ongera Ugerageze</button>
  </div>
</body>
</html>
