<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gitego Kids World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e1b4b, #06070b 70%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 400px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 32px 24px;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: 900;
    }
    button {
      margin-top: 16px;
      padding: 12px 24px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">G</div>
    <h1 style="margin:0 0 8px">Gitego Kids World</h1>
    <p style="margin:0;color:#94a3b8;line-height:1.5">
      Nta internet iboneka ubu. Genzura Wi-Fi cyangwa Data hanyuma ukande hano munsi.
    </p>
    <button onclick="window.location.href='https://gitego-kids-world.onrender.com'">🔄 Ongera Ugerageze</button>
  </div>
</body>
</html>
